name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc gdb gdbserver

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run full verification suite
        run: make check

  gdb-compatibility:
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu-version: "22.04"
            python-version: "3.10"
          - ubuntu-version: "24.04"
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native compatibility dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils ca-certificates g++ gcc gdb gdbserver

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Record GDB build and feature gates
        run: uv run python scripts/probe_gdb_features.py --output gdb-features.json

      - name: Run MI transcript and live GDB suites
        run: uv run pytest -ra tests/test_mi.py tests/test_session_smoke.py

      - name: Upload GDB feature report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdb-features-ubuntu-${{ matrix.ubuntu-version }}-py${{ matrix.python-version }}
          path: gdb-features.json
